<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found · Harness Patterns</title>
<meta name="robots" content="noindex">
<style>
  :root{--bg:#EDF0EE;--ink:#15211F;--muted:#5A6764;--rope:#D4541A}
  @media (prefers-color-scheme:dark){:root{--bg:#101614;--ink:#E8EDEA;--muted:#93A19D}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,serif;padding:16px;box-sizing:border-box;text-align:center}
  a{color:var(--rope)}
  p{color:var(--muted)}
</style>
<script>
  // Turn a wrong address into a search, e.g. /agent-harness-engineering-pattern/circuit-breaker
  // opens the book searching for "circuit breaker" (or jumps straight to that pattern).
  (function () {
    var base = '/agent-harness-engineering-pattern/';
    var rest = location.pathname.indexOf(base) === 0 ? location.pathname.slice(base.length) : location.pathname.slice(1);
    var word = decodeURIComponent(rest.split('/').filter(Boolean).pop() || '').replace(/\.html?$/i, '').replace(/[-_]+/g, ' ').trim();
    location.replace(base + (word ? '?q=' + encodeURIComponent(word) : '') + location.hash);
  })();
</script>
</head>
<body>
  <div>
    <h1>Page not found</h1>
    <p>Taking you to <a href="/agent-harness-engineering-pattern/">Harness Patterns</a>…</p>
  </div>
</body>
</html>
